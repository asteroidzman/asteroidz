<!-- A settings gear, drawn as one filled path so the bar's iconTint can
     recolour it wholesale.

     Solid white rather than currentColor: ColorOverlay paints through the alpha
     channel, so the source colour is discarded and only the coverage matters.
     A stroked outline would leave the tint painting the strokes AND the holes
     between the teeth, which reads as a blob at pill size. -->
