<?xml version='1.0' encoding='UTF-8'?>
<!-- The IEC 5009 power symbol: a broken ring with a vertical bar through the
     gap. Drawn as filled shapes rather than strokes, for the reason the gear
     beside it gives. The bar's iconTint paints through the alpha channel, so
     coverage is the whole picture and a stroked outline reads as a blob at pill
     size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <path fill="#ffffff" d="M12 2.6a1.25 1.25 0 0 1 1.25 1.25v7.4a1.25 1.25 0 0 1-2.5 0v-7.4A1.25 1.25 0 0 1 12 2.6z"/>
  <path fill="#ffffff" fill-rule="evenodd" d="M7.7 4.9a1.2 1.2 0 0 1 1.25 2.05 6.2 6.2 0 1 0 6.1 0A1.2 1.2 0 0 1 16.3 4.9a8.6 8.6 0 1 1-8.6 0z"/>
</svg>
