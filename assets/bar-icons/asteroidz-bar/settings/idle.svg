<?xml version='1.0' encoding='UTF-8'?>
<!-- Idle: a crescent moon.

     One filled path, solid white, so the bar's iconTint can recolour it
     wholesale: ColorOverlay paints through the alpha channel, so the source
     colour is discarded and only the coverage matters. A stroked outline
     would leave the tint painting the strokes and the holes alike, which
     reads as a blob at sidebar size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <path fill="#ffffff" d="M20.3 15.6A8.6 8.6 0 0 1 9 4.3a8.9 8.9 0 1 0 11.3 11.3z"/>
</svg>
